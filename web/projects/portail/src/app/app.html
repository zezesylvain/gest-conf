<a class="skip-link" href="#contenu">{{ 'portail.layout.skipToContent' | translate }}</a>

<header class="site-header">
  <a class="brand" routerLink="/">{{ 'shared.appName' | translate }}</a>
  <div class="header-tools">
    @if (session.authenticated()) {
      <a class="account-link" routerLink="/compte">{{ 'portail.layout.myAccount' | translate }}</a>
    } @else {
      <a class="account-link" routerLink="/compte/connexion">
        {{ 'portail.layout.signIn' | translate }}
      </a>
    }
    <gc-language-switcher />
  </div>
</header>

<main id="contenu" class="site-main" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <p>{{ 'portail.layout.footer' | translate }}</p>
</footer>
