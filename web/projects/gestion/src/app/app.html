<a class="skip-link" href="#contenu">{{ 'gestion.layout.skipToContent' | translate }}</a>

<header class="app-header">
  <a class="brand" routerLink="/">
    {{ 'shared.appName' | translate }} · {{ 'gestion.layout.area' | translate }}
  </a>
  <div class="header-tools">
    @if (email()) {
      <a class="account" href="/compte">{{ email() }}</a>
    }
    <gc-language-switcher />
    @if (email()) {
      <button type="button" class="logout" (click)="logout()" [disabled]="loggingOut()">
        {{ 'gestion.layout.logout' | translate }}
      </button>
    }
  </div>
</header>

<main id="contenu" class="app-main" tabindex="-1">
  <router-outlet />
</main>
