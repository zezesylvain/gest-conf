[project]
name = "gestconf-backend"
version = "0.1.0"
description = "API Django de la plateforme GEST-CONF"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # tri des imports
    "B",            # bugbear
    "UP",           # syntaxe Python moderne
    "DJ",           # règles Django
    "S",            # sécurité (bandit)
    "SIM",          # simplifications
    "RUF",          # règles propres à ruff
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # import * entre fichiers de configuration
"**/tests/**/*.py" = ["S101", "S105", "S106"]  # assert et mots de passe factices
# Vues DRF : attributs de classe déclaratifs (required_capabilities, filterset_fields…),
# lus par le cadre et jamais modifiés en place.
"apps/*/{views,manage_views,permissions}.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "mariadb: comportement propre au moteur de base ; exécuté sur SQLite ET sur MariaDB (la CI fait foi)",
    "mariadb_only: sans objet hors MariaDB ; ignoré sous SQLite",
]

# Couverture : « pytest --cov » (rapport dans le terminal ; « --cov-report=html » pour le
# détail). Le seuil de 80 % (CLAUDE.md) s'appliquera aux modules critiques à mesure
# qu'ils arrivent (plan L1 §11) : pas de fail_under global à ce stade.
[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/settings/dev.py", "config/settings/prod.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
