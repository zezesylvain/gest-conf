  /v1/manage/editions/{edition_id}/submissions:
    get:
      operationId: manage_submissions_list
      parameters:
      - in: query
        name: duplicates
        schema:
          type: boolean
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: language
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -submitted_at
          - -updated_at
          - reference
          - title
        description: |-
          * `reference` - reference
          * `-submitted_at` - -submitted_at
          * `-updated_at` - -updated_at
          * `title` - title
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            title: Statut
            enum:
            - accepted
            - accepted_minor
            - camera_ready_received
            - confirmed
            - draft
            - presented
            - published
            - rejected
            - reviewed
            - revision_requested
            - scheduled
            - screening
            - submitted
            - under_review
            - waitlist
            - withdrawn
        description: |-
          * `draft` - brouillon
          * `submitted` - soumise
          * `screening` - vérification de recevabilité
          * `under_review` - en cours d'évaluation
          * `reviewed` - évaluée
          * `accepted` - acceptée
          * `accepted_minor` - acceptée sous réserve de corrections
          * `waitlist` - liste d'attente
          * `rejected` - rejetée
          * `revision_requested` - corrections demandées
          * `camera_ready_received` - version finale reçue
          * `confirmed` - présentation confirmée
          * `scheduled` - programmée
          * `presented` - présentée
          * `published` - publiée dans les actes
          * `withdrawn` - retirée
        explode: true
        style: form
      - in: query
        name: submission_type
        schema:
          type: string
      - in: query
        name: track
        schema:
          type: string
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionManageList'
          description: ''
