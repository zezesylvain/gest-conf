          type: string
      required:
      - current_text_version
      - granted
      - kind
      - recorded_at
      - text_version
    Consents:
      type: object
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/ConsentState'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
      required:
      - history
      - states
    Edition:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 12
        slug:
          type: string
