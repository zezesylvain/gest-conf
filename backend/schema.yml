              $ref: '#/components/schemas/PatchedPreferencesRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /v1/me/profile:
    get:
      operationId: me_profile
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: me_profile_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /v1/me/totp-qr:
    get:
      operationId: me_totp_qr
      description: |-
        ``GET /v1/me/totp-qr`` : QR code du secret TOTP en attente (plan L1 §10.2).

        Le secret est celui qu'allauth a mis en session au ``GET …/authenticators/totp`` ;
        404 sans secret en attente. Jamais mis en cache.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpQr'
          description: ''
  /v1/public/editions/current:
    get:
      operationId: public_current_edition
      description: |-
        ``GET /v1/public/editions/current`` : édition courante publiée (§9.3), sinon 404.

        Brouillons et dates internes invisibles. Sert au portail (L2) et au test de fumée.
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEdition'
          description: ''
