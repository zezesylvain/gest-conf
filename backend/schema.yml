components:
  schemas:
    AcceptRequest:
      type: object
      description: Jeton d'invitation (``token``) ou lien de liaison d'adresse (``link``),
        l'un ou l'autre.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        link:
          type: string
          minLength: 1
          maxLength: 512
    AcceptedRole:
      type: object
      properties:
        edition_id:
          type: integer
        role:
          type: string
      required:
      - edition_id
      - role
    ActivityEntry:
      type: object
      properties:
        at:
          type: string
          format: date-time
        action:
          type: string
        actor:
          type: string
        object_type:
          type: string
        object_id:
          type: string
      required:
      - action
      - actor
      - at
      - object_id
      - object_type
    ActorKind:
      enum:
      - user
      - command
      - system
      type: string
      description: |-
        * `user` - utilisateur
        * `command` - commande
        * `system` - système
    AgendaEdition:
      type: object
      properties:
        code:
          type: string
        title_fr:
          type: string
        title_en:
          type: string
        timezone:
          type: string
      required:
      - code
      - timezone
      - title_en
      - title_fr
    AgendaEntry:
      type: object
      description: '« Mon passage » (I8) : les passages de la personne connectée.'
      properties:
        edition:
          $ref: '#/components/schemas/AgendaEdition'
        version:
          type: integer
        role:
          $ref: '#/components/schemas/PassageRole'
        session:
          $ref: '#/components/schemas/AgendaSession'
        slot:
          type: integer
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        duration_min:
          type: integer
        room:
          $ref: '#/components/schemas/AgendaRoom'
        title:
          type: string
        title_en:
          type: string
        reference:
          type: string
        co_speakers:
          type: array
          items:
            type: string
        chairs:
          type: array
          items:
            type: string
        instructions:
          type: string
      required:
      - chairs
      - co_speakers
      - duration_min
      - edition
      - ends_at
      - instructions
