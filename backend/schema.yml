openapi: 3.0.3
info:
  title: GEST-CONF API
  version: 0.1.0
  description: API de la plateforme de gestion de conférences scientifiques.
paths:
  /v1/health:
    get:
      operationId: health
      description: Sonde de disponibilité (supervision externe et tests de fumée du
        déploiement).
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /v1/me:
    get:
      operationId: me
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /v1/me/consents:
    get:
      operationId: me_consents
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consents'
          description: ''
    post:
      operationId: me_consents_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
          description: ''
  /v1/me/preferences:
    patch:
      operationId: me_preferences_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPreferencesRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /v1/me/profile:
    get:
      operationId: me_profile
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: me_profile_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
components:
  schemas:
    ApiError:
      type: object
      description: 'Format de toute réponse d''erreur de l''API : {code, message,
        fields}.'
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Message lisible, dans la langue de la requête.
        fields:
          type: object
          additionalProperties: {}
          description: 'Erreurs par champ : {nom du champ: [messages]} ; objet vide
            sinon.'
      required:
      - code
      - fields
      - message
    BlankEnum:
      enum:
      - ''
    ConsentCreateRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConsentKind'
        granted:
          type: boolean
        source:
          allOf:
          - $ref: '#/components/schemas/ConsentRequestSource'
          default: account
      required:
      - granted
      - kind
    ConsentKind:
      enum:
      - privacy_notice
      - directory_listing
      type: string
      description: |-
        * `privacy_notice` - notice d'information
        * `directory_listing` - annuaire public
    ConsentRecord:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConsentKind'
        granted:
          type: boolean
        text_version:
          type: string
        recorded_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/ConsentSource'
      required:
      - granted
      - kind
      - recorded_at
      - source
      - text_version
    ConsentRequestSource:
      enum:
      - first_login
      - account
      type: string
      description: |-
        * `first_login` - première connexion
        * `account` - espace compte
    ConsentSource:
      enum:
      - first_login
      - account
      - command
      type: string
      description: |-
        * `first_login` - première connexion
        * `account` - espace compte
        * `command` - commande
    ConsentState:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConsentKind'
        granted:
          type: boolean
        text_version:
          type: string
        recorded_at:
          type: string
          format: date-time
          nullable: true
        current_text_version:
          type: string
      required:
      - current_text_version
      - granted
      - kind
      - recorded_at
      - text_version
    Consents:
      type: object
      properties:
        states:
          type: array
          items:
            $ref: '#/components/schemas/ConsentState'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
      required:
      - history
      - states
    ErrorCode:
      enum:
      - validation_error
      - bad_request
      - not_authenticated
      - permission_denied
      - not_found
      - throttled
      - server_error
      - parse_error
      - method_not_allowed
      - not_acceptable
      - unsupported_media_type
      - csrf_failed
      - in_use
      type: string
      description: |-
        * `validation_error` - Validation Error
        * `bad_request` - Bad Request
        * `not_authenticated` - Not Authenticated
        * `permission_denied` - Permission Denied
        * `not_found` - Not Found
        * `throttled` - Throttled
        * `server_error` - Server Error
        * `parse_error` - Parse Error
        * `method_not_allowed` - Method Not Allowed
        * `not_acceptable` - Not Acceptable
        * `unsupported_media_type` - Unsupported Media Type
        * `csrf_failed` - Csrf Failed
        * `in_use` - In Use
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        database:
          $ref: '#/components/schemas/ServiceStatus'
        cache:
          $ref: '#/components/schemas/ServiceStatus'
        jobs:
          $ref: '#/components/schemas/JobsStatus'
        secure:
          type: boolean
          description: Vrai si Django voit la requête comme HTTPS (contrôle du déploiement).
        release:
          type: string
      required:
      - cache
      - database
      - jobs
      - release
      - secure
      - status
    HealthStatus:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - Ok
        * `degraded` - Degraded
    JobsStatus:
      enum:
      - ok
      - late
      - unknown
      type: string
      description: |-
        * `ok` - Ok
        * `late` - Late
        * `unknown` - Unknown
    Locale:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - English
    Me:
      type: object
      description: Compte connecté. Rôles, capacités, invitations (L1.5) et état 2FA
        (L1.6) s'y ajouteront.
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        locale:
          $ref: '#/components/schemas/Locale'
        profile_complete:
          type: boolean
          description: Nom, prénom, institution et pays renseignés.
        privacy_notice_pending:
          type: boolean
          description: Vrai tant que la version courante de la notice n'a pas été
            lue.
      required:
      - email
      - id
      - locale
      - privacy_notice_pending
      - profile_complete
    PatchedPreferencesRequest:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/Locale'
    PatchedProfileRequest:
      type: object
      properties:
        title:
          oneOf:
          - $ref: '#/components/schemas/ProfileTitle'
          - $ref: '#/components/schemas/BlankEnum'
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        institution:
          type: string
          maxLength: 255
        department:
          type: string
          maxLength: 255
        country:
          type: string
          description: Code ISO 3166-1 alpha-2 (« CI », « FR »...), majuscules ou
            minuscules.
          maxLength: 2
        orcid:
          type: string
          description: Forme 0000-0000-0000-000X, clé de contrôle vérifiée.
          maxLength: 19
        bio:
          type: string
          description: Texte brut.
          maxLength: 2000
    Profile:
      type: object
      properties:
        title:
          oneOf:
          - $ref: '#/components/schemas/ProfileTitle'
          - $ref: '#/components/schemas/BlankEnum'
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        institution:
          type: string
          maxLength: 255
        department:
          type: string
          maxLength: 255
        country:
          type: string
          description: Code ISO 3166-1 alpha-2 (« CI », « FR »...), majuscules ou
            minuscules.
          maxLength: 2
        orcid:
          type: string
          description: Forme 0000-0000-0000-000X, clé de contrôle vérifiée.
          maxLength: 19
        bio:
          type: string
          description: Texte brut.
          maxLength: 2000
        is_complete:
          type: boolean
          readOnly: true
      required:
      - is_complete
    ProfileTitle:
      enum:
      - dr
      - pr
      - mr
      - ms
      type: string
      description: |-
        * `` - aucun
        * `dr` - Dr
        * `pr` - Pr
        * `mr` - M.
        * `ms` - Mme
    ServiceStatus:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - Ok
        * `error` - Error
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
servers:
- url: /api
