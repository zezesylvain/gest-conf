  /v1/manage/editions/{edition_id}/review-submissions:
    get:
      operationId: manage_review_submissions_list
      description: Suivi de l'évaluation par soumission (H6, H10).
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: late
        schema:
          type: boolean
      - in: query
        name: missing
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            title: Statut
            enum:
            - accepted
            - accepted_minor
            - camera_ready_received
            - confirmed
            - presented
            - published
            - rejected
            - reviewed
            - revision_requested
            - scheduled
            - screening
            - under_review
            - waitlist
            - withdrawn
        description: |-
          * `screening` - vérification de recevabilité
          * `under_review` - en cours d'évaluation
          * `reviewed` - évaluée
          * `accepted` - acceptée
          * `accepted_minor` - acceptée sous réserve de corrections
          * `waitlist` - liste d'attente
          * `rejected` - rejetée
          * `revision_requested` - corrections demandées
          * `camera_ready_received` - version finale reçue
          * `confirmed` - présentation confirmée
          * `scheduled` - programmée
          * `presented` - présentée
          * `published` - publiée dans les actes
          * `withdrawn` - retirée
        explode: true
        style: form
      - in: query
        name: submission_type
        schema:
          type: string
      - in: query
        name: track
        schema:
          type: string
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewSubmissionList'
          description: ''
