          maxLength: 255
        title_en:
          type: string
          title: Titre (EN)
          maxLength: 255
        theme_fr:
          type: string
          title: Thème (FR)
          maxLength: 500
        theme_en:
          type: string
          title: Thème (EN)
          maxLength: 500
        start_date:
          type: string
          format: date
          nullable: true
          title: Début
        end_date:
          type: string
          format: date
          nullable: true
          title: Fin
        venue:
          type: string
          title: Lieu
          maxLength: 255
        city:
          type: string
          title: Ville
          maxLength: 128
        country:
          type: string
          title: Pays
          maxLength: 2
        timezone:
          type: string
          title: Fuseau horaire
          maxLength: 64
        status:
          allOf:
          - $ref: '#/components/schemas/EditionStatus'
          readOnly: true
          title: Statut
        published_at:
          type: string
          format: date-time
