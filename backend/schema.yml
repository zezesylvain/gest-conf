openapi: 3.0.3
info:
  title: GEST-CONF API
  version: 0.1.0
  description: API de la plateforme de gestion de conférences scientifiques.
paths:
  /v1/health:
    get:
      operationId: health
      description: Sonde de disponibilité (supervision externe et tests de fumée du
        déploiement).
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /v1/invitations/accept:
    post:
      operationId: invitation_accept
      description: |-
        ``POST /v1/invitations/accept`` : connecté ; ``{link}`` exige une réauthentification
        récente (plan v3), ``{token}`` non (aucune adresse ajoutée au compte).
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedRole'
          description: ''
  /v1/invitations/decline:
    post:
      operationId: invitation_decline
      description: '``POST /v1/invitations/decline`` : refus sans compte (aucun droit
        donné).'
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /v1/invitations/link-email:
    post:
      operationId: invitation_link_email
      description: |-
        ``POST /v1/invitations/link-email`` : lien de liaison envoyé à l'adresse invitée
        (RG-20, option (a) de D6) ; réauthentification récente, limite ``invitation_link``.
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/invitations/lookup:
    post:
      operationId: invitation_lookup
      description: '``POST /v1/invitations/lookup`` : public, CSRF imposé, limité
        (§5.7).'
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationLookup'
          description: ''
  /v1/manage/editions:
    get:
      operationId: manage_editions_list
      description: |-
        ``GET /v1/manage/editions`` : sélecteur d'édition (§5.3, D3).

        Éditions où l'on détient au moins une capacité de gestion ; champs non sensibles ;
        **sans** 2FA (chaque édition l'exige ensuite). Seule vue de ``v1/manage/`` hors
        ``ManageViewSet`` (liste blanche du test de plateforme).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditionSummary'
          description: ''
  /v1/manage/editions/{edition_id}:
    get:
      operationId: manage_edition_retrieve
      description: '``/v1/manage/editions/{edition_id}`` : informations générales
        (§6.1).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
          description: ''
    patch:
      operationId: manage_edition_update
      description: '``/v1/manage/editions/{edition_id}`` : informations générales
        (§6.1).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditionRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
          description: ''
  /v1/manage/editions/{edition_id}/assignments:
    post:
      operationId: manage_assignment_create
      description: 'Affectations (H6, H8, H15) : création, échéance, annulation motivée.'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentManage'
          description: ''
  /v1/manage/editions/{edition_id}/assignments/{assignment_id}:
    patch:
      operationId: manage_assignment_update
      description: 'Affectations (H6, H8, H15) : création, échéance, annulation motivée.'
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentManage'
          description: ''
  /v1/manage/editions/{edition_id}/assignments/{assignment_id}/cancel:
    post:
      operationId: manage_assignment_cancel
      description: 'Affectations (H6, H8, H15) : création, échéance, annulation motivée.'
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCancelRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentManage'
          description: ''
  /v1/manage/editions/{edition_id}/audit:
    get:
      operationId: manage_audit_list
      description: |-
        ``GET …/audit`` : journal de l'édition, sans IP ni navigateur ; lecture seule (§7.4).

        Les entrées sans édition (connexions, comptes) ne sont visibles que par ``audit_query``.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: number
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: object_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
  /v1/manage/editions/{edition_id}/confidentiality:
    get:
      operationId: manage_confidentiality_retrieve
      description: |-
        ``…/confidentiality`` : double aveugle, relecteurs par soumission (§6.1).
        Écriture : réauthentification récente, audit classé critique.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Confidentiality'
          description: ''
    patch:
      operationId: manage_confidentiality_update
      description: |-
        ``…/confidentiality`` : double aveugle, relecteurs par soumission (§6.1).
        Écriture : réauthentification récente, audit classé critique.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConfidentialityRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Confidentiality'
          description: ''
  /v1/manage/editions/{edition_id}/conflicts:
    post:
      operationId: manage_conflict_create
      description: Conflit déclaré par le président (H8) ; annule l'affectation active
        éventuelle.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictManage'
          description: ''
  /v1/manage/editions/{edition_id}/decisions/batch:
    post:
      operationId: manage_decisions_batch
      description: 'Décisions provisoires en lot : tout ou rien (refus rendus par
        ligne).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionBatchRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionBatchResult'
          description: ''
  /v1/manage/editions/{edition_id}/decisions/publish:
    post:
      operationId: manage_decisions_publish
      description: 'RG-09 : publie les décisions provisoires (réauthentification récente,
        journal).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
          description: ''
  /v1/manage/editions/{edition_id}/grids:
    get:
      operationId: manage_grids_list
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grid'
          description: ''
    post:
      operationId: manage_grid_create
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grid'
          description: ''
  /v1/manage/editions/{edition_id}/grids/{grid_id}:
    get:
      operationId: manage_grid_retrieve
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: grid_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grid'
          description: ''
    patch:
      operationId: manage_grid_update
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: grid_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGridUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grid'
          description: ''
    delete:
      operationId: manage_grid_delete
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: grid_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/manage/editions/{edition_id}/grids/{grid_id}/duplicate:
    post:
      operationId: manage_grid_duplicate
      description: 'RG-05 : nouvelle version modifiable d''une grille (verrouillée
        ou non).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: grid_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grid'
          description: ''
  /v1/manage/editions/{edition_id}/invitations:
    get:
      operationId: manage_invitations_list
      description: '``…/invitations`` : liste filtrée par rôle, création, renvoi,
        annulation (§5.7).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          title: Rôle
          enum:
          - ADMIN
          - CHAIR
          - OC_MEMBER
          - SC_CHAIR
          - SC_MEMBER
        description: |-
          * `ADMIN` - administrateur de l'édition
          * `CHAIR` - président de la conférence
          * `SC_CHAIR` - président du comité scientifique
          * `OC_MEMBER` - membre du comité d'organisation
          * `SC_MEMBER` - membre du comité scientifique
      - in: query
        name: status
        schema:
          type: string
          title: Statut
          enum:
          - accepted
          - cancelled
          - declined
          - expired
          - pending
        description: |-
          * `pending` - en attente
          * `accepted` - acceptée
          * `declined` - refusée
          * `cancelled` - annulée
          * `expired` - expirée
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationWithEmailList'
          description: ''
    post:
      operationId: manage_invitations_create
      description: '``…/invitations`` : liste filtrée par rôle, création, renvoi,
        annulation (§5.7).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationBatch'
          description: ''
  /v1/manage/editions/{edition_id}/invitations/{invitation_id}/cancel:
    post:
      operationId: manage_invitation_cancel
      description: '``…/invitations`` : liste filtrée par rôle, création, renvoi,
        annulation (§5.7).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: invitation_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationWithEmail'
          description: ''
  /v1/manage/editions/{edition_id}/invitations/{invitation_id}/resend:
    post:
      operationId: manage_invitation_resend
      description: '``…/invitations`` : liste filtrée par rôle, création, renvoi,
        annulation (§5.7).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: invitation_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationWithEmail'
          description: ''
  /v1/manage/editions/{edition_id}/key-dates:
    get:
      operationId: manage_editions_key_dates_list
      description: 'Dates clés : saisie ``at_local`` à l''heure de l''édition (D13).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyDate'
          description: ''
    post:
      operationId: manage_editions_key_dates_create
      description: 'Dates clés : saisie ``at_local`` à l''heure de l''édition (D13).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyDateWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDate'
          description: ''
  /v1/manage/editions/{edition_id}/key-dates/{item_id}:
    get:
      operationId: manage_editions_key_dates_retrieve
      description: 'Dates clés : saisie ``at_local`` à l''heure de l''édition (D13).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDate'
          description: ''
    patch:
      operationId: manage_editions_key_dates_partial_update
      description: 'Dates clés : saisie ``at_local`` à l''heure de l''édition (D13).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedKeyDateWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDate'
          description: ''
    delete:
      operationId: manage_editions_key_dates_destroy
      description: 'Dates clés : saisie ``at_local`` à l''heure de l''édition (D13).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/manage/editions/{edition_id}/portal/files:
    get:
      operationId: manage_editions_portal_files_list
      description: |-
        Documents et images de l'édition : téléversement (multipart), titres, ordre,
        publication ; suppression refusée tant que le fichier est utilisé (409 ``in_use``).
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - document
          - image
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicFile'
          description: ''
    post:
      operationId: manage_editions_portal_files_create
      description: |-
        Documents et images de l'édition : téléversement (multipart), titres, ordre,
        publication ; suppression refusée tant que le fichier est utilisé (409 ``in_use``).
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFile'
          description: ''
  /v1/manage/editions/{edition_id}/portal/files/{item_id}:
    get:
      operationId: manage_editions_portal_files_retrieve
      description: |-
        Documents et images de l'édition : téléversement (multipart), titres, ordre,
        publication ; suppression refusée tant que le fichier est utilisé (409 ``in_use``).
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicFile'
          description: ''
    patch:
