    get:
      operationId: manage_invitations_list
      description: '``…/invitations`` : liste filtrée par rôle, création, renvoi,
        annulation (§5.7).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          title: Rôle
          enum:
          - ADMIN
          - CHAIR
          - OC_MEMBER
          - SC_CHAIR
          - SC_MEMBER
          - SESSION_CHAIR
          - SIGNATORY
          - SPEAKER
          - VOLUNTEER
        description: |-
          * `ADMIN` - administrateur de l'édition
          * `CHAIR` - président de la conférence
          * `SC_CHAIR` - président du comité scientifique
          * `OC_MEMBER` - membre du comité d'organisation
          * `SC_MEMBER` - membre du comité scientifique
          * `SPEAKER` - intervenant
          * `SESSION_CHAIR` - président de session
          * `VOLUNTEER` - bénévole
          * `SIGNATORY` - signataire
      - in: query
        name: status
        schema:
          type: string
          title: Statut
          enum:
          - accepted
          - cancelled
          - declined
          - expired
          - pending
        description: |-
          * `pending` - en attente
          * `accepted` - acceptée
          * `declined` - refusée
          * `cancelled` - annulée
          * `expired` - expirée
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationWithEmailList'
          description: ''
