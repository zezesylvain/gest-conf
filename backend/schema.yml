openapi: 3.0.3
info:
  title: GEST-CONF API
  version: 0.1.0
  description: API de la plateforme de gestion de conférences scientifiques.
paths:
  /v1/health:
    get:
      operationId: health
      description: |-
        Sonde de disponibilité (supervision externe et tests de fumée du déploiement).

        - 503 seulement si la base ou le cache est en panne : le site ne peut pas servir ;
        - cron de la file en retard (``jobs: late``) : ``status: degraded`` mais 200, car le
          site fonctionne (seuls les envois différés attendent) ;
        - ``jobs: unknown`` (aucun passage encore, installation neuve) ne dégrade pas l'état.
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    ApiError:
      type: object
      description: 'Format de toute réponse d''erreur de l''API : {code, message,
        fields}.'
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Message lisible, dans la langue de la requête.
        fields:
          type: object
          additionalProperties: {}
          description: 'Erreurs par champ : {nom du champ: [messages]} ; objet vide
            sinon.'
      required:
      - code
      - fields
      - message
    ErrorCode:
      enum:
      - validation_error
      - bad_request
      - not_authenticated
      - permission_denied
      - not_found
      - throttled
      - server_error
      - parse_error
      - method_not_allowed
      - not_acceptable
      - unsupported_media_type
      - csrf_failed
      - in_use
      type: string
      description: |-
        * `validation_error` - Validation Error
        * `bad_request` - Bad Request
        * `not_authenticated` - Not Authenticated
        * `permission_denied` - Permission Denied
        * `not_found` - Not Found
        * `throttled` - Throttled
        * `server_error` - Server Error
        * `parse_error` - Parse Error
        * `method_not_allowed` - Method Not Allowed
        * `not_acceptable` - Not Acceptable
        * `unsupported_media_type` - Unsupported Media Type
        * `csrf_failed` - Csrf Failed
        * `in_use` - In Use
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        database:
          $ref: '#/components/schemas/ServiceStatus'
        cache:
          $ref: '#/components/schemas/ServiceStatus'
        jobs:
          $ref: '#/components/schemas/JobsStatus'
        secure:
          type: boolean
          description: Vrai si Django voit la requête comme HTTPS (contrôle du déploiement).
        release:
          type: string
      required:
      - cache
      - database
      - jobs
      - release
      - secure
      - status
    HealthStatus:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - Ok
        * `degraded` - Degraded
    JobsStatus:
      enum:
      - ok
      - late
      - unknown
      type: string
      description: |-
        * `ok` - Ok
        * `late` - Late
        * `unknown` - Unknown
    ServiceStatus:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - Ok
        * `error` - Error
servers:
- url: /api
