        qr_code:
          type: string
          description: QR code de l'enrôlement, en data:image/svg+xml;base64,…
      required:
      - qr_code
    Track:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name_fr:
          type: string
          title: Nom (FR)
          maxLength: 255
        name_en:
          type: string
          title: Nom (EN)
          maxLength: 255
        description_fr:
          type: string
          title: Description (FR)
        description_en:
          type: string
          title: Description (EN)
        position:
          type: integer
          maximum: 65535
          minimum: 0
          title: Ordre
        is_active:
          type: boolean
          title: Actif
      required:
      - code
      - id
      - name_fr
    TrackProgress:
      type: object
      properties:
        code:
          type: string
          nullable: true
        in_review:
          type: integer
          description: Soumissions en évaluation ou évaluées.
        reviewed:
          type: integer
          description: Soumissions évaluées (RG-07).
      required:
      - code
      - in_review
      - reviewed
    TrackRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        name_fr:
          type: string
          minLength: 1
          title: Nom (FR)
          maxLength: 255
        name_en:
          type: string
          title: Nom (EN)
          maxLength: 255
        description_fr:
          type: string
          title: Description (FR)
        description_en:
          type: string
          title: Description (EN)
        position:
          type: integer
          maximum: 65535
          minimum: 0
          title: Ordre
        is_active:
          type: boolean
          title: Actif
      required:
      - code
      - name_fr
    TravelMeans:
      enum:
      - plane
      - train
      - road
      - other
      type: string
      description: |-
        * `plane` - avion
        * `train` - train
        * `road` - route
        * `other` - autre
    UnreadCount:
      type: object
      properties:
        unread:
          type: integer
      required:
      - unread
    UnsubscribeRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 400
      required:
      - token
    Unsubscribed:
      type: object
      properties:
        edition_title_fr:
          type: string
        edition_title_en:
          type: string
      required:
      - edition_title_en
      - edition_title_fr
    UserRoleStatus:
      enum:
      - active
      - revoked
      type: string
      description: |-
        * `active` - actif
        * `revoked` - révoqué
    VerificationKind:
      enum:
      - certificate
      - letter
      type: string
      description: |-
        * `certificate` - certificate
        * `letter` - letter
    VerificationStatus:
      enum:
      - valid
      - revoked
      type: string
      description: |-
        * `valid` - valid
        * `revoked` - revoked
    VisitSpeakerWriteRequest:
      type: object
      properties:
        technical_needs:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
        technical_note:
          type: string
          maxLength: 500
        arrival_local:
          type: string
          format: date-time
          nullable: true
        arrival_means:
          oneOf:
          - $ref: '#/components/schemas/TravelMeans'
          - $ref: '#/components/schemas/BlankEnum'
        arrival_reference:
          type: string
          maxLength: 60
        departure_local:
          type: string
          format: date-time
          nullable: true
        departure_means:
          oneOf:
          - $ref: '#/components/schemas/TravelMeans'
          - $ref: '#/components/schemas/BlankEnum'
        departure_reference:
          type: string
          maxLength: 60
        accommodation_needed:
          type: boolean
        transfer_needed:
          type: boolean
        speaker_note:
          type: string
          maxLength: 1000
    VisitStatus:
      enum:
      - to_arrange
      - booked
      - confirmed
      type: string
      description: |-
        * `to_arrange` - à organiser
        * `booked` - réservée
        * `confirmed` - confirmée
    WaiverRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
    WithdrawRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 2000
    Zone:
      enum:
      - local
      - international
      type: string
      description: |-
        * `local` - local
        * `international` - international
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
servers:
- url: /api
