        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        title_fr:
          type: string
          readOnly: true
          title: Titre (FR)
        title_en:
          type: string
          readOnly: true
          title: Titre (EN)
        year:
          type: integer
          readOnly: true
          title: Année
        status:
          allOf:
          - $ref: '#/components/schemas/EditionStatus'
          readOnly: true
          title: Statut
      required:
      - code
      - id
      - status
      - title_en
      - title_fr
      - year
    ErrorCode:
      enum:
      - validation_error
      - bad_request
      - not_authenticated
      - permission_denied
      - not_found
      - throttled
      - server_error
      - parse_error
      - method_not_allowed
      - not_acceptable
      - unsupported_media_type
      - csrf_failed
      - in_use
      - reauthentication_required
      - mfa_enrollment_required
      - mfa_required
      - last_admin
      - invitation_expired
      - invitation_not_pending
      - invitation_email_mismatch
      - invitation_email_unverified
      - invitation_link_invalid
      - invitation_self_accept
      - invitation_resend_limit
      - email_address_limit
      - edition_archived
      - invalid_transition
      - edition_incomplete
      - account_has_active_duties
      type: string
      description: |-
        * `validation_error` - Validation Error
        * `bad_request` - Bad Request
        * `not_authenticated` - Not Authenticated
        * `permission_denied` - Permission Denied
        * `not_found` - Not Found
        * `throttled` - Throttled
        * `server_error` - Server Error
        * `parse_error` - Parse Error
        * `method_not_allowed` - Method Not Allowed
        * `not_acceptable` - Not Acceptable
        * `unsupported_media_type` - Unsupported Media Type
        * `csrf_failed` - Csrf Failed
        * `in_use` - In Use
        * `reauthentication_required` - Reauthentication Required
        * `mfa_enrollment_required` - Mfa Enrollment Required
        * `mfa_required` - Mfa Required
        * `last_admin` - Last Admin
        * `invitation_expired` - Invitation Expired
        * `invitation_not_pending` - Invitation Not Pending
        * `invitation_email_mismatch` - Invitation Email Mismatch
        * `invitation_email_unverified` - Invitation Email Unverified
        * `invitation_link_invalid` - Invitation Link Invalid
        * `invitation_self_accept` - Invitation Self Accept
        * `invitation_resend_limit` - Invitation Resend Limit
        * `email_address_limit` - Email Address Limit
        * `edition_archived` - Edition Archived
        * `invalid_transition` - Invalid Transition
        * `edition_incomplete` - Edition Incomplete
        * `account_has_active_duties` - Account Has Active Duties
    FileUploadRequest:
