components:
  schemas:
    AcceptRequest:
      type: object
      description: Jeton d'invitation (``token``) ou lien de liaison d'adresse (``link``),
        l'un ou l'autre.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        link:
          type: string
          minLength: 1
          maxLength: 512
    AcceptedRole:
      type: object
      properties:
        edition_id:
          type: integer
        role:
          type: string
      required:
      - edition_id
      - role
    ActorKind:
      enum:
      - user
      - command
      - system
      type: string
      description: |-
        * `user` - utilisateur
        * `command` - commande
        * `system` - système
    AnonymizationRequest:
      type: object
      description: 'Confirmation explicite : l''adresse du compte, saisie à nouveau
        (plan L1 §4.9).'
      properties:
        confirmation:
          type: string
          minLength: 1
          description: Adresse e-mail du compte, saisie pour confirmer.
          maxLength: 254
      required:
      - confirmation
    ApiError:
      type: object
      description: 'Format de toute réponse d''erreur de l''API : {code, message,
        fields}.'
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Message lisible, dans la langue de la requête.
        fields:
          type: object
          additionalProperties: {}
          description: 'Erreurs par champ : {nom du champ: [messages]} ; objet vide
            sinon.'
      required:
      - code
      - fields
      - message
    AssignmentCancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
    AssignmentCreateRequest:
      type: object
      properties:
        submission:
          type: integer
        reviewer:
          type: integer
        due_local:
          type: string
          format: date-time
          nullable: true
          description: Échéance dans le fuseau de l'édition, sans fuseau ; par défaut,
            la date clé review_deadline.
        override_reason:
          type: string
          default: ''
          description: Motif de levée d'un conflit levable (réauthentification récente
            exigée).
          maxLength: 2000
      required:
      - reviewer
      - submission
    AssignmentManage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reviewer:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentStatus'
          readOnly: true
          title: Statut
        assigned_by:
          allOf:
          - $ref: '#/components/schemas/Person'
          nullable: true
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
          title: Affectée le
        due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Échéance
        reason:
          type: string
          readOnly: true
          title: Motif (refus ou annulation)
        conflict_override_reason:
          type: string
          readOnly: true
          title: Motif de la levée de conflit
        pseudonym_rank:
          type: integer
          readOnly: true
          title: Rang du pseudonyme
        reminders:
          readOnly: true
          title: Relances envoyées
        review_status:
          description: 'Évaluation : null (non commencée), draft ou submitted.'
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ReviewStatus'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - assigned_at
      - assigned_by
      - conflict_override_reason
      - due_at
      - id
      - pseudonym_rank
      - reason
      - reminders
      - review_status
      - reviewer
      - status
    AssignmentStatus:
      enum:
      - active
      - declined
      - cancelled
      type: string
      description: |-
        * `active` - actif
        * `declined` - déclinée
        * `cancelled` - annulée
    AuditEntry:
      type: object
      description: Entrée du journal d'une édition, **sans IP ni navigateur** (minimisation,
        §7.4).
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
          title: Date
        action:
          type: string
          readOnly: true
        actor_kind:
          allOf:
          - $ref: '#/components/schemas/ActorKind'
          readOnly: true
        actor_id:
          type: integer
          nullable: true
          title: Acteur
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
          title: Type d'objet
        object_id:
          type: string
          readOnly: true
          title: Identifiant d'objet
        before:
          readOnly: true
          nullable: true
          title: Avant
        after:
          readOnly: true
          nullable: true
          title: Après
        reason:
          type: string
          readOnly: true
          title: Motif
      required:
      - action
      - actor_id
      - actor_kind
      - actor_name
      - after
      - at
      - before
      - id
      - object_id
      - object_type
      - reason
    AuthorDecision:
      type: object
      properties:
        outcome:
