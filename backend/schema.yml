      type: string
      description: |-
        * `privacy_notice` - notice d'information
        * `directory_listing` - annuaire public
        * `photo_publication` - publication de la photo
    ConsentRecord:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConsentKind'
        granted:
          type: boolean
        text_version:
          type: string
        recorded_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/ConsentSource'
      required:
      - granted
      - kind
      - recorded_at
      - source
      - text_version
    ConsentRequestSource:
      enum:
      - first_login
      - account
      type: string
      description: |-
        * `first_login` - première connexion
        * `account` - espace compte
    ConsentSource:
      enum:
      - first_login
      - account
      - command
      type: string
      description: |-
        * `first_login` - première connexion
        * `account` - espace compte
        * `command` - commande
    ConsentState:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConsentKind'
        granted:
          type: boolean
        text_version:
          type: string
        recorded_at:
          type: string
          format: date-time
          nullable: true
