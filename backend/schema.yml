    Locale:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - Français
        * `en` - English
    Me:
      type: object
      description: |-
        Compte connecté : identité, langue, éditions (rôles, capacités), invitations en
        attente, état de la 2FA.
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        locale:
          $ref: '#/components/schemas/Locale'
