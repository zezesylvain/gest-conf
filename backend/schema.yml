          title: Fichier PDF
        max_file_mb:
          type: integer
          maximum: 50
          minimum: 1
          title: Taille maximale du fichier (Mo)
        position:
          type: integer
          maximum: 65535
          minimum: 0
          title: Ordre
        is_active:
          type: boolean
          title: Actif
      required:
