  /v1/public/portal/pages/{slug}:
    get:
      operationId: public_portal_page
      description: |-
        Page publiée et ses sections publiées, dans l'ordre ; 404 si inconnue (le gabarit
        d'une page du site s'affiche alors seul).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicComposition'
          description: ''
  /v1/public/portal/routes:
    get:
      operationId: public_portal_routes
      description: Routes à pré-rendre et leur **nombre attendu** (vérifié au build,
        plan L2 §2.2).
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRoutes'
          description: ''
  /v1/public/portal/site:
    get:
      operationId: public_portal_site
      description: Données des gabarits des pages du site, en un appel.
      tags:
      - public
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSite'
          description: ''
components:
  schemas:
    AcceptRequest:
      type: object
      description: Jeton d'invitation (``token``) ou lien de liaison d'adresse (``link``),
        l'un ou l'autre.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        link:
          type: string
          minLength: 1
          maxLength: 512
    AcceptedRole:
      type: object
      properties:
        edition_id:
          type: integer
        role:
          type: string
      required:
      - edition_id
      - role
    ActorKind:
      enum:
      - user
      - command
      - system
      type: string
      description: |-
        * `user` - utilisateur
        * `command` - commande
        * `system` - système
    AnonymizationRequest:
      type: object
      description: 'Confirmation explicite : l''adresse du compte, saisie à nouveau
        (plan L1 §4.9).'
      properties:
        confirmation:
          type: string
          minLength: 1
          description: Adresse e-mail du compte, saisie pour confirmer.
          maxLength: 254
      required:
      - confirmation
    ApiError:
      type: object
      description: 'Format de toute réponse d''erreur de l''API : {code, message,
        fields}.'
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Message lisible, dans la langue de la requête.
        fields:
          type: object
          additionalProperties: {}
          description: 'Erreurs par champ : {nom du champ: [messages]} ; objet vide
            sinon.'
      required:
      - code
      - fields
      - message
    AuditEntry:
      type: object
      description: Entrée du journal d'une édition, **sans IP ni navigateur** (minimisation,
        §7.4).
      properties:
        id:
          type: integer
          readOnly: true
        at:
          type: string
          format: date-time
          readOnly: true
          title: Date
        action:
          type: string
          readOnly: true
        actor_kind:
          allOf:
          - $ref: '#/components/schemas/ActorKind'
          readOnly: true
        actor_id:
          type: integer
          nullable: true
          title: Acteur
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        object_type:
          type: string
          readOnly: true
          title: Type d'objet
        object_id:
          type: string
          readOnly: true
          title: Identifiant d'objet
        before:
          readOnly: true
          nullable: true
          title: Avant
        after:
          readOnly: true
          nullable: true
          title: Après
        reason:
          type: string
          readOnly: true
          title: Motif
      required:
      - action
      - actor_id
      - actor_kind
      - actor_name
      - after
      - at
      - before
      - id
      - object_id
      - object_type
      - reason
    BlankEnum:
      enum:
      - ''
    Capability:
      enum:
      - edition.read
      - edition.write
      - edition.publish
      - edition.archive
      - members.read
      - members.manage
      - audit.read
      - portal.write
      type: string
      description: |-
        * `edition.read` - edition.read
        * `edition.write` - edition.write
        * `edition.publish` - edition.publish
        * `edition.archive` - edition.archive
        * `members.read` - members.read
        * `members.manage` - members.manage
        * `audit.read` - audit.read
        * `portal.write` - portal.write
    Confidentiality:
      type: object
      properties:
        double_blind:
          type: boolean
          title: Double aveugle
        reviewers_per_submission:
          type: integer
          maximum: 10
          minimum: 1
          title: Relecteurs par soumission
    ConsentCreateRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ConsentKind'
        granted:
          type: boolean
        source:
          allOf:
          - $ref: '#/components/schemas/ConsentRequestSource'
          default: account
      required:
      - granted
      - kind
    ConsentKind:
      enum:
      - privacy_notice
      - directory_listing
