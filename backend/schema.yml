openapi: 3.0.3
info:
  title: GEST-CONF API
  version: 0.1.0
  description: API de la plateforme de gestion de conférences scientifiques.
paths:
  /v1/health:
    get:
      operationId: health
      description: Sonde de disponibilité (supervision externe et tests de fumée du
        déploiement).
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /v1/invitations/accept:
    post:
      operationId: invitation_accept
      description: |-
        ``POST /v1/invitations/accept`` : connecté ; ``{link}`` exige une réauthentification
        récente (plan v3), ``{token}`` non (aucune adresse ajoutée au compte).
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedRole'
          description: ''
  /v1/invitations/decline:
    post:
      operationId: invitation_decline
      description: '``POST /v1/invitations/decline`` : refus sans compte (aucun droit
        donné).'
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /v1/invitations/link-email:
    post:
      operationId: invitation_link_email
      description: |-
        ``POST /v1/invitations/link-email`` : lien de liaison envoyé à l'adresse invitée
        (RG-20, option (a) de D6) ; réauthentification récente, limite ``invitation_link``.
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/invitations/lookup:
    post:
      operationId: invitation_lookup
      description: '``POST /v1/invitations/lookup`` : public, CSRF imposé, limité
        (§5.7).'
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationLookup'
          description: ''
  /v1/manage/editions:
    get:
      operationId: manage_editions_list
      description: |-
        ``GET /v1/manage/editions`` : sélecteur d'édition (§5.3, D3).

        Éditions où l'on détient au moins une capacité de gestion ; champs non sensibles ;
        **sans** 2FA (chaque édition l'exige ensuite). Seule vue de ``v1/manage/`` hors
        ``ManageViewSet`` (liste blanche du test de plateforme).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EditionSummary'
          description: ''
  /v1/manage/editions/{edition_id}:
    get:
      operationId: manage_edition_retrieve
      description: '``/v1/manage/editions/{edition_id}`` : informations générales
        (§6.1).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
          description: ''
    patch:
      operationId: manage_edition_update
      description: '``/v1/manage/editions/{edition_id}`` : informations générales
        (§6.1).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEditionRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
          description: ''
  /v1/manage/editions/{edition_id}/activity:
    get:
      operationId: manage_activity
      description: '``…/activity`` : fil d''activité du CO (N14).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityEntry'
          description: ''
  /v1/manage/editions/{edition_id}/announcements:
    get:
      operationId: manage_announcements_list
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
          description: ''
    post:
      operationId: manage_announcements_create
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
          description: ''
  /v1/manage/editions/{edition_id}/announcements/{announcement_id}:
    get:
      operationId: manage_announcements_retrieve
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
          description: ''
    patch:
      operationId: manage_announcements_update
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
          description: ''
    delete:
      operationId: manage_announcements_destroy
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/manage/editions/{edition_id}/announcements/{announcement_id}/cancel:
    post:
      operationId: manage_announcements_cancel
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelledCount'
          description: ''
  /v1/manage/editions/{edition_id}/announcements/{announcement_id}/preview:
    get:
      operationId: manage_announcements_preview
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - fr
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementPreview'
          description: ''
  /v1/manage/editions/{edition_id}/announcements/{announcement_id}/publish:
    post:
      operationId: manage_announcements_publish
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
          description: ''
  /v1/manage/editions/{edition_id}/announcements/{announcement_id}/test:
    post:
      operationId: manage_announcements_test
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '202':
          description: No response body
  /v1/manage/editions/{edition_id}/announcements/{announcement_id}/withdraw:
    post:
      operationId: manage_announcements_withdraw
      description: '``…/announcements`` : annonces (brouillon, aperçu, essai, publication,
        retrait).'
      parameters:
      - in: path
        name: announcement_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
          description: ''
  /v1/manage/editions/{edition_id}/assignments:
    post:
      operationId: manage_assignment_create
      description: 'Affectations (H6, H8, H15) : création, échéance, annulation motivée.'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentManage'
          description: ''
  /v1/manage/editions/{edition_id}/assignments/{assignment_id}:
    patch:
      operationId: manage_assignment_update
      description: 'Affectations (H6, H8, H15) : création, échéance, annulation motivée.'
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssignmentUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentManage'
          description: ''
  /v1/manage/editions/{edition_id}/assignments/{assignment_id}/cancel:
    post:
      operationId: manage_assignment_cancel
      description: 'Affectations (H6, H8, H15) : création, échéance, annulation motivée.'
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: integer
        required: true
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCancelRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentManage'
          description: ''
  /v1/manage/editions/{edition_id}/audit:
    get:
      operationId: manage_audit_list
      description: |-
        ``GET …/audit`` : journal de l'édition, sans IP ni navigateur ; lecture seule (§7.4).

        Les entrées sans édition (connexions, comptes) ne sont visibles que par ``audit_query``.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: number
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: object_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
          format: date-time
      - in: query
        name: until
        schema:
          type: string
          format: date-time
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEntryList'
          description: ''
  /v1/manage/editions/{edition_id}/billing/dashboard:
    get:
      operationId: manage_billing_dashboard
      description: '``…/billing/dashboard`` : tableau de bord financier (``finance.read``,
        J12).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceDashboard'
          description: ''
  /v1/manage/editions/{edition_id}/billing/documents:
    get:
      operationId: manage_billing_documents_list
      description: |-
        ``…/billing/documents`` : factures, avoirs et pro forma de l'édition (``finance.read``),
        les plus récentes d'abord ; filtre ``kind``.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: kind
        schema:
          type: string
        description: Nature de la pièce.
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillingDocumentList'
          description: ''
  /v1/manage/editions/{edition_id}/billing/documents/export:
    get:
      operationId: manage_billing_documents_export
      description: |-
        ``…/billing/documents/export`` : pièces de facturation en CSV (export comptable),
        journalisé, réauthentification (J1).
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: kind
        schema:
          type: string
        description: Nature de la pièce.
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /v1/manage/editions/{edition_id}/billing/documents/issue-pending:
    post:
      operationId: manage_billing_issue_pending
      description: |-
        ``…/billing/documents/issue-pending`` : factures des paiements reçus avant que les
        mentions de facturation soient complètes (J8), avec réauthentification.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCount'
          description: ''
  /v1/manage/editions/{edition_id}/billing/payments:
    get:
      operationId: manage_billing_payments_list
      description: |-
        ``…/billing/payments`` : encaissements de l'édition (``finance.read``), les plus
        récents d'abord ; ``…/billing/payments/export`` : CSV journalisé, réauthentification.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: method
        schema:
          type: string
        description: Moyen de paiement.
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
        description: Fournisseur (manual, fake, cinetpay).
      - in: query
        name: status
        schema:
          type: string
        description: Statut du paiement.
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentListList'
          description: ''
  /v1/manage/editions/{edition_id}/billing/payments/export:
    get:
      operationId: manage_billing_payments_export
      description: |-
        ``…/billing/payments`` : encaissements de l'édition (``finance.read``), les plus
        récents d'abord ; ``…/billing/payments/export`` : CSV journalisé, réauthentification.
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: method
        schema:
          type: string
        description: Moyen de paiement.
      - in: query
        name: provider
        schema:
          type: string
        description: Fournisseur (manual, fake, cinetpay).
      - in: query
        name: status
        schema:
          type: string
        description: Statut du paiement.
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /v1/manage/editions/{edition_id}/billing/profile:
    get:
      operationId: manage_billing_profile_retrieve
      description: '``…/billing/profile`` : mentions de facturation de l''édition
        (Q8).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProfile'
          description: ''
    patch:
      operationId: manage_billing_profile_update
      description: '``…/billing/profile`` : mentions de facturation de l''édition
        (Q8).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBillingProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProfile'
          description: ''
  /v1/manage/editions/{edition_id}/budget:
    get:
      operationId: manage_budget_retrieve
      description: '``…/budget`` : budget prévisionnel et réalisé (N4).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /v1/manage/editions/{edition_id}/budget/export:
    get:
      operationId: manage_budget_export
      description: 'Export du budget (RG-17 : journalisé, réauthentification récente).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: query
        name: file_format
        schema:
          type: string
          enum:
          - csv
          - xlsx
      tags:
      - manage
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /v1/manage/editions/{edition_id}/budget/lines:
    post:
      operationId: manage_budget_lines_create
      description: '``…/budget`` : budget prévisionnel et réalisé (N4).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      tags:
      - manage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineWriteRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /v1/manage/editions/{edition_id}/budget/lines/{line_id}:
    patch:
      operationId: manage_budget_lines_update
      description: '``…/budget`` : budget prévisionnel et réalisé (N4).'
      parameters:
      - in: path
        name: edition_id
        schema:
          type: integer
        required: true
      - in: path
        name: line_id
        schema:
          type: integer
        required: true
      tags:
      - manage
