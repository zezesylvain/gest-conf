        extension_until:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Échéance de la dérogation en cours (RG-02), sinon null.
        possible_duplicate:
          type: boolean
          readOnly: true
          description: 'F15 : même soumissionnaire, même titre normalisé, autre soumission
            active.'
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Soumise le
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - authors_count
      - authors_label
      - extension_until
      - id
      - language
      - pages
      - possible_duplicate
      - reference
      - status
      - submission_type
      - submitted_at
      - title
      - track
      - updated_at
    SubmissionManageDetail:
      type: object
      description: |-
        Détail de gestion : métadonnées, auteurs avec adresses, fichiers, historique,
        révisions, dérogations. Réservé à ``submissions.read`` (jamais aux relecteurs, RG-04).
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
          nullable: true
          title: Référence
        status:
          allOf:
          - $ref: '#/components/schemas/SubmissionStatus'
          readOnly: true
          title: Statut
        title:
          type: string
          readOnly: true
          title: Titre
        track:
          type: string
          readOnly: true
          nullable: true
        submission_type:
          type: string
          readOnly: true
          nullable: true
        language:
          type: string
          readOnly: true
          title: Langue
        authors_label:
          type: string
          readOnly: true
          description: 'Auteurs dans l''ordre : « Prénom Nom ; Prénom Nom ».'
        authors_count:
          type: integer
          readOnly: true
        pages:
          type: integer
          nullable: true
          readOnly: true
          description: 'Pages du PDF courant (null : aucun).'
        extension_until:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Échéance de la dérogation en cours (RG-02), sinon null.
        possible_duplicate:
          type: boolean
          readOnly: true
          description: 'F15 : même soumissionnaire, même titre normalisé, autre soumission
            active.'
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Soumise le
        updated_at:
          type: string
          format: date-time
          readOnly: true
        abstract:
          type: string
          readOnly: true
          title: Résumé
        keywords:
          type: array
          items:
            type: string
          readOnly: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Retirée le
        withdraw_reason:
          type: string
          readOnly: true
          title: Motif du retrait
        submitter_name:
          type: string
          readOnly: true
        authors:
          type: array
          items:
            $ref: '#/components/schemas/ManageAuthor'
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionFile'
          readOnly: true
        declarations:
          type: array
          items:
            $ref: '#/components/schemas/DeclarationState'
          readOnly: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/ManageHistoryEntry'
          readOnly: true
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/RevisionSummary'
          readOnly: true
        extensions:
          type: array
          items:
            $ref: '#/components/schemas/Extension'
          readOnly: true
        can_extend:
          type: boolean
          readOnly: true
          description: Une dérogation peut être accordée (brouillon ou soumise, édition
            non archivée).
      required:
      - abstract
      - authors
      - authors_count
      - authors_label
      - can_extend
      - declarations
      - extension_until
      - extensions
      - files
      - history
      - id
      - keywords
      - language
      - pages
      - possible_duplicate
      - reference
      - revisions
      - status
      - submission_type
      - submitted_at
      - submitter_name
      - title
      - track
      - updated_at
      - withdraw_reason
      - withdrawn_at
    SubmissionReviews:
      type: object
      description: Évaluations envoyées d'une soumission, note finale, divergence
        (H12), discussion.
      properties:
        final_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        spread:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        divergent:
          type: boolean
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewManage'
        discussion_opened_at:
          type: string
          format: date-time
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/DiscussionMessageManage'
      required:
      - discussion_opened_at
      - divergent
      - final_score
      - messages
      - reviews
      - spread
      - threshold
    SubmissionStats:
      type: object
      properties:
        by_status:
          type: object
          additionalProperties:
            type: integer
          description: Statut → nombre (tous les statuts).
        total:
          type: integer
          description: Soumissions hors brouillons.
        drafts:
          type: integer
      required:
      - by_status
      - drafts
      - total
    SubmissionStatus:
      enum:
      - draft
      - submitted
      - screening
      - under_review
      - reviewed
      - accepted
      - accepted_minor
      - waitlist
      - rejected
      - revision_requested
      - camera_ready_received
      - confirmed
      - scheduled
      - presented
      - published
      - withdrawn
      type: string
      description: |-
        * `draft` - brouillon
        * `submitted` - soumise
        * `screening` - vérification de recevabilité
        * `under_review` - en cours d'évaluation
        * `reviewed` - évaluée
        * `accepted` - acceptée
        * `accepted_minor` - acceptée sous réserve de corrections
        * `waitlist` - liste d'attente
        * `rejected` - rejetée
        * `revision_requested` - corrections demandées
        * `camera_ready_received` - version finale reçue
        * `confirmed` - présentation confirmée
        * `scheduled` - programmée
        * `presented` - présentée
        * `published` - publiée dans les actes
        * `withdrawn` - retirée
    SubmissionType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
          pattern: ^[-a-zA-Z0-9_]+$
        label_fr:
          type: string
          title: Libellé (FR)
          maxLength: 255
        label_en:
          type: string
          title: Libellé (EN)
          maxLength: 255
        description_fr:
          type: string
          title: Description (FR)
        description_en:
          type: string
          title: Description (EN)
        default_duration_min:
          type: integer
          maximum: 65535
          minimum: 0
          nullable: true
          title: Durée par défaut (min)
        abstract_max_words:
          type: integer
          maximum: 2000
          minimum: 50
          title: Mots maximum du résumé
        file_policy:
          allOf:
