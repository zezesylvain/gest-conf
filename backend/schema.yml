      - name
      - oc_function
      - revoked_at
      - role
      - source
      - status
      - user_id
    MenuItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        location:
          allOf:
          - $ref: '#/components/schemas/MenuLocation'
          title: Emplacement
        label_fr:
          type: string
          title: Libellé (FR)
