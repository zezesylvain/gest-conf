# Intégration continue : qualité, tests et builds (étude §7.2, §9.3, annexe A6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # o2switch propose Python jusqu'à 3.13 (étude §7.2).
        python: ["3.12", "3.13"]
    services:
      mariadb:
        # Version à aligner sur celle fournie par o2switch (non vérifiée ; Django 5.2 exige >= 10.5).
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: gestconf
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/gestconf
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Dépendances verrouillées (avec empreintes)
        # --require-hashes : refuse tout paquet non épinglé ou dont l'empreinte diffère
        # du fichier verrouillé (requirements/compile.sh, pip-tools --generate-hashes).
        run: pip install --require-hashes -r requirements/dev.txt

      - name: Lint et formatage (ruff)
        run: |
          ruff check . ../deploy
          ruff format --check . ../deploy

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (pytest, MariaDB) et couverture
        # GESTCONF_REQUIRE_MARIADB : la suite refuse de démarrer si la base de test n'est
        # pas MariaDB (conftest.py), au lieu de passer en silence sur SQLite en ignorant
        # les tests mariadb_only. -rs : motifs des tests ignorés dans le journal.
        env:
          GESTCONF_REQUIRE_MARIADB: "1"
        run: pytest -rs --cov --cov-report=term

      - name: Tests (pytest, SQLite)
        # Plan L1 §11 et §13 : pytest sur SQLite ET sur MariaDB. SQLite est le moteur par
        # défaut du poste de développement (CLAUDE.md) ; les tests marqués « mariadb »
        # s'exécutent sur les deux moteurs, les tests « mariadb_only » sont ignorés ici.
        env:
          DATABASE_URL: "sqlite://:memory:"
        run: pytest -q -rs

      - name: Dépendances de production installables en roues manylinux2014 (comme deploy.sh)
        # deploy.sh installe prod.txt avec --only-binary=:all: sur o2switch : une dépendance
        # publiée seulement en sdist, ou seulement en manylinux_2_28 et plus, ferait échouer
        # le déploiement. Plateforme minimale à ajuster selon la glibc relevée par V02
        # (docs/L1-verifications-o2switch.md).
        run: >-
          pip download --quiet -d /tmp/wheels --only-binary=:all: --require-hashes
          --platform manylinux2014_x86_64 --python-version ${{ matrix.python }} --implementation cp
          -r requirements/prod.txt

      - name: Traductions de l'API à jour (.po et .mo versionnés)
        # .mo comparés décompilés (msgunfmt) et non octet par octet : le binaire dépend de
        # la version de msgfmt. .po contrôlés par makemessages sur une copie, puis msgattrib
        # (ni entrée non traduite, ni approximative, ni obsolète). Détails : locale/check.sh.
        run: |
          command -v msgfmt >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext)
          msgfmt --version | sed -n 1p
          locale/check.sh

      - name: Tests du script de fusion .htaccess
        working-directory: deploy
        run: python -m pytest -p no:django -p no:cacheprovider test_htaccess_merge.py

      - name: Contrôles de sécurité Django en configuration de production
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-key-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: conference.exemple.org
          DJANGO_CSRF_TRUSTED_ORIGINS: https://conference.exemple.org
          GESTCONF_EMAIL_BACKEND: anymail.backends.brevo.EmailBackend
          DEFAULT_FROM_EMAIL: GEST-CONF <no-reply@conference.exemple.org>
          GESTCONF_PUBLIC_URL: https://conference.exemple.org
        # Comme deploy.sh : sécurité sans --database (sinon models.W036, plan L1 §3.7), puis
        # contrôles de la base seuls (--tag database : connexion, mysql.W002 mode strict).
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py check --database default --tag database --fail-level WARNING

      - name: Schéma OpenAPI à jour (source du client Angular)
        run: |
          python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
          diff -u schema.yml /tmp/schema.yml

      - name: Audit des dépendances
        run: pip-audit -r requirements/prod.txt

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - name: Client API généré à jour
        run: |
          npm run api:generate
          git status --porcelain -- projects/shared/src/lib/api | tee /tmp/api-diff
          test ! -s /tmp/api-diff || (echo "Client API obsolète : lancer npm run api:generate" && exit 1)

      - name: Formatage (prettier)
        run: npm run format:check

      - name: Lint (ESLint, dont règles d'accessibilité)
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build (portail pré-rendu + gestion), CSP et budgets
        # Les budgets d'angular.json (dont le CSS initial du portail) font échouer le build.
        run: npm run build

      - name: Thème Material absent des pages publiques pré-rendues (plan L1 §10.5)
        # Feuille séparée (gc-theme.css, non injectée), chargée par la coque de /compte.
        run: |
          test -f dist/portail/browser/gc-theme.css
          ! grep -l 'gc-theme' dist/portail/browser/index.html dist/portail/browser/index.csr.html

      - name: robots.txt à la racine du portail
        run: |
          for path in /api/ /gestion/ /compte/; do
            grep -qx "Disallow: $path" dist/portail/browser/robots.txt
          done

      - name: Publication du build Angular (artefact)
        # Plan L1 §11 (D18) : en L1, deploy.sh reste manuel ; la CI publie le dist comme
        # artefact (CSP à empreintes déjà injectée par npm run build).
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

  shell:
    name: Scripts de déploiement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck deploy/*.sh backend/requirements/compile.sh backend/locale/check.sh
